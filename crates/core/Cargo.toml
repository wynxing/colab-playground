[package]
name = "colab-playground-core"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["http"]
# Blocking HTTPS client used for Hugging Face lookups. Disabled builds keep the
# whole API and report `ErrorKind::HttpUnavailable` instead.
http = ["dep:ureq"]

[dependencies]
log = "0.4"
base64 = "0.22"
dirs = "6"
# Checks the signature of a release's SHA256SUMS before an update is installed (verifying only).
ed25519-dalek = { version = "3", default-features = false }
# Unpacks the Linux download when the app updates itself (pure Rust, no `tar` process).
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.11", default-features = false }
tar = { version = "0.4", default-features = false }
thiserror = "2"
toml = "1"
ureq = { version = "3", optional = true }
webpki-roots = "0.26"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"

[lints]
workspace = true
