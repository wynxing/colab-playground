[package]
name = "colab-playground"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "colab_playground"
path = "src/lib.rs"
# Each doctest links gpui and Ely into its own binary; keep examples in tests instead.
doctest = false

[[bin]]
name = "colab-playground"
path = "src/main.rs"
test = false

[build-dependencies]
# Windows version resource and icon for the executable (the build script does nothing for other
# targets).
tauri-winres = "0.3"

[dependencies]
# Ely GPUI Components, pinned to one commit of `main`. The umbrella crate re-exports every
# chapter (`ely_gpui_component::{buttons, feedback, settings, account, terminal, ...}`).
ely-gpui-component = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "c01a140e95deef8437c85aafd3617acfd798d58e" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "wayland", "x11"] }
colab-playground-core = { path = "../core" }
anyhow = "1"
dirs = "6"
futures = "0.3"
env_logger = { version = "0.11", features = ["humantime"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
url = "2"

[dev-dependencies]
ely-gpui-component = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "c01a140e95deef8437c85aafd3617acfd798d58e", features = ["test-support"] }
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
tempfile = "3"
# `tests/lint.rs` reads the app's and the core's sources; line numbers need `span-locations`.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[[test]]
name = "ui"
path = "tests/ui/main.rs"

[lints]
workspace = true
