# Builds the downloads of a release and attaches them to its GitHub release.
#
# Push a vX.Y.Z tag, or run this workflow by hand with that tag: the platform
# files, SHA256SUMS and its signature are attached to the release, which is created
# as a draft and published only once every file is on it. The version in
# [workspace.package] must be the tag without its `v`, or the build fails.
#
# Every release is signed. The signature is made with the UPDATE_SIGNING_KEY secret and
# checked against the keys in crates/core/update-keys.txt before anything is attached,
# so a release no installed copy could verify is never published; a missing secret
# fails the run (docs/RELEASING.md#the-update-signature).
#
# A manual run with `dry run` ticked builds the ref it runs on instead of the tag, signs and
# checks everything, and skips the last job: use it to try a packaging change, or a new
# signing key, without publishing anything.
#
# Windows and Linux must both build; the macOS runner is often never assigned, so it
# is allowed to miss and the release goes out without that download. Fixing the
# workflow after a tag exists: run this workflow on `main` with the tag as input — it
# builds the tagged code with the workflow from `main`.
#
# What each file is and why it looks the way it does: docs/RELEASING.md.
name: Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (for example v0.5.0).
        type: string
        required: true
      dry_run:
        description: Build, sign and check the downloads, but do not touch a release.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One run per tag: a second run of the same tag replaces the files, it does not
  # race the first.
  group: package-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # The oldest Ubuntu runner: the binary needs the glibc it was built against
          # or newer (Ubuntu 22.04: glibc 2.35). Keep the requirement in docs/USAGE.md
          # in step.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # A macOS runner is often never assigned and the job is cancelled after a wait:
    # that must not fail the release or hold back the other two platforms.
    continue-on-error: ${{ matrix.target == 'aarch64-apple-darwin' }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
      TAG: ${{ inputs.tag || github.ref_name }}
      # Windows: link the C runtime statically, so the exe starts without the Visual
      # C++ Redistributable installed.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      # macOS: the oldest version the binary targets and the bundle declares.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run on `main` builds the tagged code with this workflow file; a dry
          # run has no tag yet, so it builds the ref this run is on.
          ref: ${{ (inputs.dry_run && github.ref) || inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libfontconfig-dev

      - name: Version and file name
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "colab-playground") | .version' | tr -d '\r')
          if [ -z "$version" ]; then
            echo "::error::Could not read the version of colab-playground"
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the version in Cargo.toml ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # No version in the names: the release tag says which version the files are,
          # and an installed copy fetches them by these names.
          echo "BASE=colab-playground-$BUILD_TARGET" >> "$GITHUB_ENV"

      - name: Build
        env:
          # Marks the binary as a release download, the only kind that replaces itself
          # with a newer release (crates/core/src/updater/layout.rs).
          COLAB_PLAYGROUND_RELEASE_BUILD: "1"
        run: cargo build --release --locked -p colab-playground --target "$BUILD_TARGET"

      - name: Package (Windows, bare exe)
        if: runner.os == 'Windows'
        run: |
          exe="target/$BUILD_TARGET/release/colab-playground.exe"
          # A dynamically linked C runtime would import VCRUNTIME140.dll.
          if grep -qai 'vcruntime140' "$exe"; then
            echo "::error::$exe imports the Visual C++ runtime DLL; the static C runtime did not apply"
            exit 1
          fi
          mkdir -p dist
          cp "$exe" "dist/$BASE.exe"
          echo "ASSET=$BASE.exe" >> "$GITHUB_ENV"

      - name: Package (Linux, tar.gz)
        if: runner.os == 'Linux'
        run: |
          stage="$RUNNER_TEMP/$BASE"
          mkdir -p "$stage" dist
          install -m 755 "target/$BUILD_TARGET/release/colab-playground" "$stage/colab-playground"
          readelf -d "$stage/colab-playground" | grep NEEDED
          install -m 644 LICENSE README.md "$stage/"
          tar -C "$RUNNER_TEMP" --owner=0 --group=0 --numeric-owner -czf "dist/$BASE.tar.gz" "$BASE"
          listing=$(tar -tzvf "dist/$BASE.tar.gz")
          if ! grep -Eq "^-rwxr-xr-x .* $BASE/colab-playground\$" <<<"$listing"; then
            echo "::error::The binary in the archive is not executable"
            exit 1
          fi
          echo "ASSET=$BASE.tar.gz" >> "$GITHUB_ENV"

      - name: Package (macOS, .app in a zip)
        if: runner.os == 'macOS'
        run: |
          stage="$RUNNER_TEMP/$BASE"
          app="$stage/Colab Playground.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          cp "target/$BUILD_TARGET/release/colab-playground" "$app/Contents/MacOS/colab-playground"
          cp assets/icon/icon.icns "$app/Contents/Resources/AppIcon.icns"
          copyright=$(grep -m 1 '^Copyright' LICENSE)
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>Colab Playground</string>
            <key>CFBundleExecutable</key>
            <string>colab-playground</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>io.github.wynxing.colab-playground</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Colab Playground</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$VERSION</string>
            <key>CFBundleVersion</key>
            <string>$VERSION</string>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.developer-tools</string>
            <key>LSMinimumSystemVersion</key>
            <string>$MACOSX_DEPLOYMENT_TARGET</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSHumanReadableCopyright</key>
            <string>$copyright</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          # Ad-hoc signature (no Apple Developer ID, not notarised): Apple silicon runs
          # only signed code, and the signature seals Info.plist and the icon.
          codesign --force --sign - "$app"
          codesign --verify --strict --verbose=2 "$app"
          install -m 644 LICENSE README.md "$stage/"
          ditto -c -k --keepParent "$stage" "dist/$BASE.zip"
          check="$RUNNER_TEMP/unzipped"
          ditto -x -k "dist/$BASE.zip" "$check"
          codesign --verify --strict --verbose=2 "$check/$BASE/Colab Playground.app"
          echo "ASSET=$BASE.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/${{ env.ASSET }}
          archive: false
          if-no-files-found: error
          overwrite: true

  checksums:
    name: SHA256SUMS
    needs: build
    # Runs even though a cancelled macOS leg failed the build job: what must be here
    # is checked by name below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The tagged code, for the trusted keys the new signature is checked against. Before
      # the downloads: checkout cleans the workspace, which would delete `dist`.
      - uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.dry_run && github.ref) || inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          # Keep each file as it was uploaded: the macOS download is itself a zip.
          skip-decompress: true
          path: dist
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          # Windows and Linux are the two this release cannot go without; macOS joins
          # them only when its runner was assigned.
          for asset in colab-playground-x86_64-pc-windows-msvc.exe \
                       colab-playground-x86_64-unknown-linux-gnu.tar.gz; do
            if [ ! -s "$asset" ]; then
              echo "::error::$asset was not built"
              exit 1
            fi
          done
          sha256sum colab-playground-* > SHA256SUMS
          cat SHA256SUMS
      # A release is always signed: without the signature the app cannot install it, so an
      # unsigned release would silently break updating for every installed copy. The key
      # pair and how to rotate it: docs/RELEASING.md#the-update-signature.
      - name: Sign SHA256SUMS
        working-directory: dist
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::the UPDATE_SIGNING_KEY secret is not set; a release must be signed"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/update-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          # What is signed: a line naming the release, then SHA256SUMS. The app
          # rebuilds it from the tag it downloads from, so an older release's signed
          # files cannot pass for this one.
          signed="$RUNNER_TEMP/signed"
          { printf 'colab-playground %s\n' "$TAG"; cat SHA256SUMS; } > "$signed"
          openssl pkeyutl -sign -rawin -inkey "$key" -in "$signed" -out SHA256SUMS.sig
          ls -l SHA256SUMS.sig
      # The app accepts a signature only from a key compiled into it, so a release signed
      # with any other key would publish and then refuse to install. The keys are the raw
      # 32-byte ones in update-keys.txt; each is wrapped here in the DER header of an
      # Ed25519 SubjectPublicKeyInfo, which is what openssl reads as a public key.
      - name: Check the signature against the app's trusted keys
        working-directory: dist
        run: |
          # The message is rebuilt here from the tag, exactly as the app rebuilds it for the
          # release it downloads from (crates/core/src/updater/verify.rs::signed_message), so
          # this checks what an installed copy will check.
          signed="$RUNNER_TEMP/checked"
          { printf 'colab-playground %s\n' "$TAG"; cat SHA256SUMS; } > "$signed"
          der="$RUNNER_TEMP/trusted-key.der"
          found=''
          while read -r line; do
            key="$(printf '%s' "${line%%#*}" | tr -d '[:space:]')"
            [ -n "$key" ] || continue
            printf 'MCowBQYDK2VwAyEA' | openssl base64 -d -A > "$der"
            printf '%s' "$key" | openssl base64 -d -A >> "$der"
            if openssl pkeyutl -verify -rawin -pubin -inkey "$der" \
                 -in "$signed" -sigfile SHA256SUMS.sig > /dev/null 2>&1; then
              found="$key"
              break
            fi
          done < "$GITHUB_WORKSPACE/crates/core/update-keys.txt"
          if [ -z "$found" ]; then
            echo "::error::SHA256SUMS.sig matches no key in crates/core/update-keys.txt"
            exit 1
          fi
          echo "Signed with one of the keys the app trusts."
      - uses: actions/upload-artifact@v7
        with:
          name: sums
          path: dist/SHA256SUMS
          archive: false
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7
        with:
          name: sums
          path: dist/SHA256SUMS.sig
          archive: false
          if-no-files-found: error
          overwrite: true
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # The workflow's `if` cannot read the secrets context, so it is mapped here.
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}

  publish:
    name: Attach to the release and publish it
    needs: checksums
    # A dry run stops after the checks: nothing is attached and nothing is published.
    if: ${{ !cancelled() && needs.checksums.result == 'success' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          skip-decompress: true # as in the checksums job: the macOS zip stays a zip
          path: dist
      - name: Check the files
        working-directory: dist
        run: |
          ls -l
          sha256sum -c SHA256SUMS
          for asset in colab-playground-x86_64-pc-windows-msvc.exe \
                       colab-playground-x86_64-unknown-linux-gnu.tar.gz SHA256SUMS; do
            [ -s "$asset" ] || { echo "::error::$asset is missing or empty"; exit 1; }
          done
      - name: Create the release as a draft
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already has a release; its files are replaced."
            exit 0
          fi
          # The notes are the tag's changelog entry when there is one, and GitHub's
          # own summary otherwise.
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## /{exit} on{print}' \
            CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$TAG" --draft --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi
      - name: Upload the files
        run: gh release upload "$TAG" dist/* --clobber
      # Last step: the release stays a draft (hidden, never "latest", so the app's
      # update check cannot point at it) until every file is attached.
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false
